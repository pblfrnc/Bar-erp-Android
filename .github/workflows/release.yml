# Compila os APKs do BarERP Pro (Garçom e Cozinha/KDS) a cada push na main e publica na release "latest",
# de onde o próprio app baixa a atualização (src/services/appUpdate.ts): version.json + os dois APKs.
name: APKs Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Push novo cancela o build anterior que ainda estiver rodando: só a última versão é publicada
concurrency:
  group: release-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Versão <major.minor do package.json>.<builds desde o início dessa versão>. Ao subir o major.minor no
      # package.json, troque PRIMEIRO_BUILD pelo número do próximo build (o run_number dele), para voltar a .0.
      # O versionCode do Android sai dessa versão (android/app/build.gradle) e precisa sempre crescer.
      - name: Versão
        id: v
        env:
          PRIMEIRO_BUILD: 1 # 2.1.0
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          patch=$(( ${{ github.run_number }} - PRIMEIRO_BUILD ))
          [ "$patch" -lt 0 ] && patch=0
          version="$base.$patch"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versão $version"

      # Mesma chave dos APKs já instalados: com outra chave o Android recusa atualizar por cima. Sem o segredo o
      # build para (gerar uma chave nova aqui quebraria a atualização de todos os celulares).
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Cadastre o segredo KEYSTORE_BASE64 (Settings > Secrets and variables > Actions). Veja o README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Dependências
        run: npm ci

      - name: APK do Garçom
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npm run build:waiter
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon)
          mkdir -p saida
          cp android/app/build/outputs/apk/release/app-release.apk saida/BarERP-Garcom.apk

      # Mesmo projeto Android com outro applicationId e nome: os dois apps convivem no mesmo celular
      - name: APK da Cozinha (KDS)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npm run build:kds
          sed -i 's/"appId": "com.barerp.app"/"appId": "com.barerp.kds"/' capacitor.config.json
          sed -i 's/applicationId "com.barerp.app"/applicationId "com.barerp.kds"/' android/app/build.gradle
          npx cap sync android
          sed -i 's/BarERP Garçom/BarERP Cozinha/g' android/app/src/main/res/values/strings.xml
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk saida/BarERP-Cozinha.apk

      - name: Publicar na release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          echo "{\"version\": \"$VERSION\", \"commit\": \"${{ github.sha }}\", \"buildTime\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > saida/version.json
          title="BarERP Pro Android v$VERSION"
          notes=$(printf 'Apps Android do BarERP Pro v%s\n\n- **BarERP-Garcom.apk**: pedidos nas mesas pelo celular do garçom\n- **BarERP-Cozinha.apk**: fila de pedidos da cozinha e do bar (KDS)\n\nOs apps já instalados avisam desta versão e atualizam sozinhos.' "$VERSION")
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "$title" --notes "$notes"
            gh release upload latest saida/* --clobber
          else
            gh release create latest saida/* --title "$title" --notes "$notes" --target "${{ github.sha }}"
          fi
